[meta]
version = "0.1.0"

[capabilities]
system_info = "safe"
system_temperature = "safe"
network_interfaces = "safe"
network_status = "safe"
processes_list = "safe"
logs_search = "safe"
files_read = "safe"
files_search = "safe"

files_write = "approval"
service_restart = "approval"
package_install = "approval"
memory_write = "safe"
memory_read = "safe"
memory_search = "safe"

arbitrary_shell = "disabled"
sudo = "disabled"
command_execute = "safe"

# G21 Isolated GUI Tools
desktop_screenshot = "safe"
desktop_windows = "safe"
desktop_focus = "approval"
desktop_click = "approval"
desktop_type = "approval"
desktop_keypress = "approval"

# G22 Real Desktop Tools
desktop_observe = "approval"
CAP_WAYLAND_OBSERVE = "approval"
CAP_WAYLAND_CONTROL = "approval"
real_desktop_focus = "approval"
real_desktop_click = "approval"
real_desktop_type = "approval"
real_desktop_keypress = "approval"

# G23 Browser Tools
browser_navigate = "approval"
browser_read = "safe"
browser_type = "approval"
browser_click = "approval"
browser_download = "approval"
browser_upload = "approval"
browser_search = "safe"

[roles.orchestrator]
description = "High-level decomposition and task coordination"
allowed_capabilities = [
    "agent.delegate",
    "agent.summarize"
]
max_execution_time = 60
can_mutate = false

[roles.system_diagnostics]
description = "Host state inspection and read-only troubleshooting"
allowed_capabilities = [
    "system_info",
    "system_temperature",
    "network_interfaces",
    "network_status",
    "processes_list",
    "logs_search",
    "files_read",
    "command_execute",
    "memory_write",
    "memory_read",
    "memory_search",
    "browser_search"
]
max_execution_time = 45
can_mutate = false

[roles.system_maintenance]
description = "Controlled host mutation and remediation"
allowed_capabilities = [
    "service_restart",
    "files_write",
    "package_install"
]
max_execution_time = 30
can_mutate = true
approval_required = true

[roles.browser_research]
description = "Web retrieval and doc lookups in isolated domain"
allowed_capabilities = [
    "browser_navigate",
    "browser_read",
    "browser_type",
    "browser_click",
    "browser_download",
    "browser_upload",
    "browser_search"
]
max_execution_time = 60
can_mutate = true
approval_required = true

[roles.gui_automation]
description = "Sandboxed desktop interaction and real wayland observation"
allowed_capabilities = [
    "desktop_screenshot",
    "desktop_windows",
    "desktop_focus",
    "desktop_click",
    "desktop_type",
    "desktop_keypress",
    "desktop_observe",
    "CAP_WAYLAND_OBSERVE",
    "CAP_WAYLAND_CONTROL",
    "real_desktop_focus",
    "real_desktop_click",
    "real_desktop_type",
    "real_desktop_keypress"
]
max_execution_time = 120
can_mutate = true
approval_required = true

[config]
gui_gpu_accel = false

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "A secure, multi-agent orchestration architecture"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pybinstream",
    "playwright",
    "ddgs",
    "rich"
]

[project.optional-dependencies]
voice = [
    "pyaudio",
    "piper-tts"
]
voice-hq = [
    "faster-whisper",
    "numpy",
    "edge-tts==7.2.8",
]
dev = [
    "pytest",
    "ruff",
    "mypy"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E402"]

[tool.mypy]
python_version = "3.11"
strict = false

[tool.setuptools.packages.find]
where = ["."]
include = ["jarvis*"]
